          type: string
          enum:
          - cancelled
          - confirmed
          - pending
        description: |-
          * `pending` - Ожидает
          * `confirmed` - Подтверждена
          * `cancelled` - Отменена
      - in: query
        name: table
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReservationList'
          description: ''
  /api/v1/admin-api/reservations/{id}/:
