components:
  schemas:
    AddCartItemRequest:
      type: object
      properties:
        item:
          type: integer
        quantity:
          type: integer
          maximum: 99
          minimum: 1
          default: 1
      required:
      - item
    AdminContact:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        phone:
          type: string
          readOnly: true
        message:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
